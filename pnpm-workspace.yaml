# pnpm 11+ reads project settings from this file (not package.json "pnpm" field)
# https://pnpm.io/settings

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true

# Astro 6 requires Vite 7 (not Vite 8)
overrides:
  vite: ^7

patchedDependencies:
  '@qwik.dev/partytown@0.11.2': patches/@qwik.dev__partytown@0.11.2.patch
